<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Four - Neon Arcade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white font-['Outfit'] overflow-hidden selection:bg-fuchsia-500 selection:text-white">

    <!-- Background Video for Landing Page -->
    <div id="video-container" class="fixed inset-0 w-full h-full z-0 pointer-events-none transition-opacity duration-1000">
        <div class="absolute inset-0 bg-gray-950/70 z-10"></div>
        <video autoplay loop muted playsinline class="w-full h-full object-cover z-0">
            <source src="https://ynn787qihi.ufs.sh/f/Qj6TSP5Fj9mq2VfmgrBSqMNBOhv50Ha9gowcPdZTKJepiyk8" type="video/mp4">
        </video>
    </div>

    <!-- MAIN MENU SCREEN -->
    <main id="main-menu" class="relative z-20 flex flex-col items-center justify-center min-h-screen px-4 transition-all duration-700 ease-in-out">
        <h1 class="text-6xl md:text-8xl font-black mb-12 tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-500 to-fuchsia-500 drop-shadow-[0_0_20px_rgba(192,38,211,0.5)] uppercase title-glow">
            Connect Four
        </h1>
        
        <div class="glass-panel p-8 rounded-3xl w-full max-w-md flex flex-col gap-4 shadow-2xl">
            <button id="btn-play-ai" class="menu-btn group relative overflow-hidden bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl py-4 font-bold text-lg transition-all">
                <span class="relative z-10">Play vs Computer</span>
            </button>
            <button id="btn-play-local" class="menu-btn group relative overflow-hidden bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl py-4 font-bold text-lg transition-all">
                <span class="relative z-10">Pass & Play (Local 2P)</span>
            </button>
            <button id="btn-play-online" class="menu-btn group relative overflow-hidden bg-cyan-500/20 hover:bg-cyan-500/40 border border-cyan-400/50 rounded-xl py-4 font-bold text-lg transition-all text-cyan-300">
                <span class="relative z-10">Play Online</span>
            </button>
            <button id="btn-profile" class="menu-btn group relative overflow-hidden bg-fuchsia-500/20 hover:bg-fuchsia-500/40 border border-fuchsia-400/50 rounded-xl py-4 font-bold text-lg transition-all text-fuchsia-300 mt-4">
                <span class="relative z-10">Player Profile & Stats</span>
            </button>
        </div>
    </main>

    <!-- GAME SCREEN -->
    <section id="game-screen" class="relative z-20 hidden flex-col items-center justify-center min-h-screen px-4 py-8">
        <!-- Header -->
        <header class="w-full max-w-4xl flex justify-between items-center mb-8 glass-panel px-6 py-4 rounded-2xl">
            <button id="btn-back-menu" class="text-sm uppercase tracking-wider font-bold text-gray-400 hover:text-white transition-colors">
                ← Main Menu
            </button>
            <h2 id="game-mode-display" class="text-xl font-bold text-cyan-400 uppercase tracking-widest">Local Mode</h2>
            <button id="btn-restart" class="text-sm uppercase tracking-wider font-bold text-fuchsia-400 hover:text-fuchsia-300 transition-colors">
                Restart ↻
            </button>
        </header>

        <!-- Scoreboard -->
        <div class="flex gap-8 mb-8">
            <div id="p1-score-card" class="glass-panel px-8 py-4 rounded-2xl text-center border-b-4 border-transparent transition-all">
                <p id="p1-name" class="text-sm text-gray-400 font-bold uppercase tracking-wider mb-1">Player 1</p>
                <p id="p1-score" class="text-4xl font-black text-white">0</p>
            </div>
            <div class="flex flex-col items-center justify-center px-4">
                <p class="text-gray-500 font-black text-2xl">VS</p>
                <p id="turn-indicator" class="text-sm font-bold text-cyan-400 uppercase mt-2 tracking-widest animate-pulse">P1 Turn</p>
            </div>
            <div id="p2-score-card" class="glass-panel px-8 py-4 rounded-2xl text-center border-b-4 border-transparent transition-all opacity-50">
                <p id="p2-name" class="text-sm text-gray-400 font-bold uppercase tracking-wider mb-1">Player 2</p>
                <p id="p2-score" class="text-4xl font-black text-white">0</p>
            </div>
        </div>

        <!-- Game Board Container -->
        <div class="board-container p-4 glass-panel rounded-3xl shadow-[0_0_50px_rgba(0,0,0,0.5)]">
            <!-- 7 Columns -->
            <div id="game-board" class="grid grid-cols-7 gap-2 sm:gap-3 p-2 bg-blue-900/40 rounded-2xl border border-blue-500/30">
                <!-- Columns and cells will be generated by JS -->
            </div>
        </div>
    </section>

    <!-- AI DIFFICULTY MODAL -->
    <div id="modal-ai-difficulty" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 backdrop-blur-sm">
        <div class="glass-panel p-8 rounded-3xl max-w-sm w-full mx-4 border border-cyan-500/30 shadow-[0_0_40px_rgba(6,182,212,0.2)]">
            <h2 class="text-2xl font-bold mb-6 text-center text-cyan-400">Select Difficulty</h2>
            <div class="flex flex-col gap-3">
                <button class="ai-diff-btn py-3 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 transition-colors" data-level="easy">Easy (Random)</button>
                <button class="ai-diff-btn py-3 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 transition-colors" data-level="medium">Medium</button>
                <button class="ai-diff-btn py-3 rounded-xl bg-cyan-500/20 hover:bg-cyan-500/40 border border-cyan-400/50 text-cyan-300 font-bold transition-colors" data-level="hard">Hard (Minimax)</button>
            </div>
            <button class="mt-6 w-full py-2 text-gray-400 hover:text-white text-sm uppercase font-bold tracking-wider btn-close-modal">Cancel</button>
        </div>
    </div>

    <!-- PROFILE & STATS MODAL -->
    <div id="modal-profile" class="fixed inset-0 z-50 hidden flex-col items-center justify-center bg-black/80 backdrop-blur-md">
        <div class="glass-panel p-8 rounded-3xl max-w-lg w-full mx-4 border border-fuchsia-500/30 shadow-[0_0_40px_rgba(217,70,239,0.2)] max-h-[90vh] overflow-y-auto">
            <h2 class="text-3xl font-black mb-6 text-center text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-500">Player Profile</h2>
            
            <div class="mb-4">
                <label class="block text-sm font-bold text-gray-400 uppercase mb-2">Nickname</label>
                <input type="text" id="input-nickname" class="w-full bg-black/50 border border-white/20 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-fuchsia-500 transition-colors" placeholder="Enter nickname">
            </div>

            <div class="mb-8">
                <label class="block text-sm font-bold text-gray-400 uppercase mb-2">Preferred Color</label>
                <div class="flex gap-4">
                    <button id="btn-pref-red" class="flex-1 py-3 rounded-xl bg-red-500/20 border-2 border-red-500 text-red-400 font-bold transition-all">Red</button>
                    <button id="btn-pref-yellow" class="flex-1 py-3 rounded-xl bg-white/5 border-2 border-transparent text-gray-400 hover:bg-white/10 font-bold transition-all">Yellow</button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-white/5 p-4 rounded-2xl text-center border border-white/10">
                    <p class="text-gray-400 text-xs font-bold uppercase mb-1">Total Matches</p>
                    <p id="stat-matches" class="text-3xl font-black text-white">0</p>
                </div>
                <div class="bg-white/5 p-4 rounded-2xl text-center border border-white/10">
                    <p class="text-gray-400 text-xs font-bold uppercase mb-1">Win Rate</p>
                    <p id="stat-winrate" class="text-3xl font-black text-cyan-400">0%</p>
                </div>
                <div class="bg-white/5 p-4 rounded-2xl text-center border border-white/10">
                    <p class="text-gray-400 text-xs font-bold uppercase mb-1">Total Wins</p>
                    <p id="stat-wins" class="text-2xl font-bold text-green-400">0</p>
                </div>
                <div class="bg-white/5 p-4 rounded-2xl text-center border border-white/10">
                    <p class="text-gray-400 text-xs font-bold uppercase mb-1">Total Losses</p>
                    <p id="stat-losses" class="text-2xl font-bold text-red-400">0</p>
                </div>
            </div>

            <button id="btn-save-profile" class="w-full py-4 rounded-xl bg-gradient-to-r from-cyan-500 to-fuchsia-500 text-white font-bold text-lg shadow-lg hover:shadow-cyan-500/25 transition-all mb-4">Save & Close</button>
            <button class="w-full py-2 text-gray-400 hover:text-white text-sm uppercase font-bold tracking-wider btn-close-modal">Cancel</button>
        </div>
    </div>

    <!-- ONLINE MULTIPLAYER MODAL -->
    <div id="modal-online" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 backdrop-blur-sm">
        <div class="glass-panel p-8 rounded-3xl max-w-sm w-full mx-4 border border-cyan-500/30">
            <h2 class="text-2xl font-bold mb-6 text-center text-cyan-400">Online Multiplayer</h2>
            <div class="mb-4">
                <input type="text" id="input-room-code" class="w-full bg-black/50 border border-white/20 rounded-xl px-4 py-3 text-white text-center font-mono text-xl focus:outline-none focus:border-cyan-500" placeholder="Room Code">
            </div>
            <div class="flex gap-3">
                <button id="btn-create-room" class="flex-1 py-3 rounded-xl bg-cyan-500/20 hover:bg-cyan-500/40 border border-cyan-400/50 text-cyan-300 font-bold transition-colors">Create</button>
                <button id="btn-join-room" class="flex-1 py-3 rounded-xl bg-white/10 hover:bg-white/20 border border-white/20 font-bold transition-colors">Join</button>
            </div>
            <p class="text-xs text-gray-500 mt-4 text-center">Note: Requires active backend server for socket events.</p>
            <button class="mt-6 w-full py-2 text-gray-400 hover:text-white text-sm uppercase font-bold tracking-wider btn-close-modal">Cancel</button>
        </div>
    </div>

    <!-- GAME OVER MODAL -->
    <div id="modal-game-over" class="fixed inset-0 z-50 hidden flex-col items-center justify-center bg-black/60 backdrop-blur-sm transition-opacity duration-300 opacity-0 pointer-events-none">
        <div class="glass-panel p-10 rounded-3xl max-w-sm w-full mx-4 text-center transform scale-95 transition-transform duration-300">
            <h2 id="winner-text" class="text-4xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-500">Player 1 Wins!</h2>
            <p class="text-gray-400 mb-8 font-bold">Great match!</p>
            <button id="btn-rematch" class="w-full py-4 rounded-xl bg-gradient-to-r from-cyan-500 to-fuchsia-500 text-white font-bold text-lg shadow-lg mb-3 hover:scale-105 transition-transform">Rematch</button>
            <button id="btn-game-over-menu" class="w-full py-3 rounded-xl bg-white/10 hover:bg-white/20 border border-white/20 font-bold transition-colors">Main Menu</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
